name: Debug

on:
  push:

jobs:
  clippy_check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy
